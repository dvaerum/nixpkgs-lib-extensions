name: Flake Checks

on:
  # push covers only main (the merge target); pull_request covers PR
  # branches. The old `push: branches: '**'` ran every PR twice -- once
  # per trigger. Deliberate consequence: a branch push without an open PR
  # gets no CI -- open a PR, or use the manual dispatch below.
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# a superseded run of the same ref is cancelled, not raced
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    runs-on: ubuntu-latest
    # generous: a cold-cache run builds several VM tests; the point is
    # bounding a hung run, not racing a healthy one
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          # for the aarch64 EVALUATION step below: the suite contains IFD
          # (importIfNix parse probes, applyPatches), so evaluating the
          # aarch64 checks must BUILD those derivations as aarch64-linux --
          # nix only accepts them as local builds with the platform listed
          # here (the daemon reads this at install time)
          extra_nix_config: |
            extra-platforms = aarch64-linux

      # Nix store persisted through the GitHub Actions cache -- the
      # zero-config option: no secrets, unlike cachix (auth token), and
      # magic-nix-cache has been discontinued upstream. Keyed by
      # flake.lock so an input bump starts a fresh cache but still
      # restores the nearest older one; gc keeps it under the runner
      # cache budget.
      - name: Cache the Nix store
        uses: nix-community/cache-nix-action@v6
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.lock') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 5G

      # ubuntu-latest runners expose /dev/kvm, which the VM tests require
      # (deliberately not listed here -- the list grows and this comment
      # would rot; they are the checks named *-vm)
      - name: Run flake checks
        run: |
          nix --extra-experimental-features 'nix-command flakes' flake check --print-build-logs

      # the aarch64 evaluation is NOT pure evaluation: its IFD derivations
      # (see the Install Nix comment) actually run aarch64 binaries, and
      # stock ubuntu runners ship no aarch64 binfmt -- register qemu user
      # emulation so those builds can execute. The action installs the
      # handlers with the fix-binary (F) flag, so they keep working inside
      # nix build sandboxes.
      - name: Register qemu user emulation for aarch64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      # cross-system coverage: evaluate (not build) every check for the
      # other supported systems -- the check names are derived from the
      # flake itself, so a new check is covered by construction. Forcing
      # every drvPath in ONE eval needs no jq and no shell loop.
      # `nix flake check --all-systems --no-build` cannot be used -- the
      # suite contains IFD steps, which --no-build refuses to realize.
      - name: Evaluate checks for aarch64-linux
        run: |
          nix --extra-experimental-features 'nix-command flakes' \
            eval .#checks.aarch64-linux --raw --apply \
            'cs: builtins.concatStringsSep "\n" (map (n: "ok: " + n + " -> " + cs.${n}.drvPath) (builtins.attrNames cs))'
